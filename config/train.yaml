# mlx-lm LoRA training config
# Run with: python train.py  or  mlx_lm.lora --config config/train.yaml

model: "mlx-community/Qwen3-4B-8bit"
train: true
data: "data/processed"
batch_size: 4
iters: 1000
val_batches: 25
learning_rate: 1.0e-4
lora_layers: 16
lora_rank: 16
lora_scale: 20.0
lora_dropout: 0.0
max_seq_length: 1024
grad_checkpoint: true
adapter_path: "adapters"
save_every: 100
steps_per_eval: 100
# set to "wandb" and install wandb to get loss curves in the browser
report_to: "none"
